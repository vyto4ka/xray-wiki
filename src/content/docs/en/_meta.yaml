sections:
  - id: fundamentals
    title: Networking Basics
    icon: network
    order: 1
    description: Clear explanations of TCP, UDP, QUIC, TLS, SNI, DNS, DPI, NAT, and Linux kernel networking.
  - id: getting-started
    title: Getting Started
    icon: rocket
    order: 2
    description: Xray-core architecture, config.json structure, multi-file configs, and CLI commands.
  - id: vless-reality
    title: VLESS, XTLS & REALITY
