  - id: protocols
    title: Other Protocols
    icon: plug
    order: 7
    description: TUN, Tunnel, Freedom, Blackhole, Shadowsocks 2022, Trojan, VMess, WireGuard, Hysteria, MASQUE, SOCKS, and HTTP.
  - id: recipes
    title: vless:// Links & Guides
    icon: book
    order: 8
    description: Complete breakdown of vless:// share URI parameters and their JSON config equivalents.
